services:
  bot:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kukai:kukai@db:5432/kukai
      SCHEDULER_DB_URL: postgresql+psycopg://kukai:kukai@db:5432/kukai

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kukai
      POSTGRES_USER: kukai
      POSTGRES_PASSWORD: kukai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kukai -d kukai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
