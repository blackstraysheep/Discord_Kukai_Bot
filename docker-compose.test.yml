name: kukai_bot_test

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env.test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - test_data:/app/data

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kukai_test
      POSTGRES_USER: kukai_test
      POSTGRES_PASSWORD: change-me-local-test-only
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kukai_test -d kukai_test"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  test_data:
  test_postgres_data:
