[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kukai-bot"
version = "0.1.0"
description = "Discord-based haiku session (句会) management bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3,<3.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
    "asyncpg>=0.29,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "APScheduler>=3.10,<4.0",
    "pydantic-settings>=2.0,<3.0",
    "Jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
]

[project.scripts]
kukai-bot = "bot.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bot"]
