services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kukai:kukai@db:5432/kukai}
      SCHEDULER_DB_URL: ${SCHEDULER_DB_URL:-postgresql+psycopg://kukai:kukai@db:5432/kukai}
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kukai}
      POSTGRES_USER: ${POSTGRES_USER:-kukai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kukai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kukai} -d ${POSTGRES_DB:-kukai}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
